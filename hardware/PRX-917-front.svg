<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="monospace">
  <!-- 자체 배경(README 라이트/다크 모두에서 일관되게 보이도록) -->
  <rect x="0" y="0" width="560" height="440" rx="16" fill="#14160e"/>
  <text x="28" y="40" fill="#e0a53a" font-size="22" font-weight="700" letter-spacing="2">PRX-917</text>
  <text x="28" y="60" fill="#8f8a5e" font-size="11" letter-spacing="2">PORTABLE RADIO EXCHANGE · 전술 보안 핸드셋</text>

  <!-- 안테나 -->
  <rect x="150" y="78" width="18" height="38" rx="6" fill="#23231c" stroke="#8a7a3f" stroke-width="2"/>
  <!-- 채널 노브 -->
  <circle cx="300" cy="96" r="16" fill="#707e3a" stroke="#e0a53a" stroke-width="2"/>
  <line x1="300" y1="96" x2="300" y2="84" stroke="#14160e" stroke-width="2"/>
  <!-- 상태 LED -->
  <circle cx="232" cy="120" r="5" fill="#ff7b3a"/>

  <!-- 본체 -->
  <rect x="140" y="110" width="200" height="300" rx="24" fill="#3f4524" stroke="#8a7a3f" stroke-width="2"/>
  <!-- 범퍼(모서리) -->
  <rect x="128" y="120" width="18" height="40" rx="7" fill="#9a8a5c"/>
  <rect x="334" y="120" width="18" height="40" rx="7" fill="#9a8a5c"/>
  <rect x="128" y="360" width="18" height="40" rx="7" fill="#9a8a5c"/>
  <rect x="334" y="360" width="18" height="40" rx="7" fill="#9a8a5c"/>

  <!-- OLED (앰버 모노 디스플레이) -->
  <rect x="160" y="140" width="160" height="120" rx="6" fill="#2a1e08" stroke="#8a7a3f" stroke-width="2"/>
  <line x1="172" y1="166" x2="300" y2="166" stroke="#e0a53a" stroke-width="3"/>
  <line x1="172" y1="186" x2="286" y2="186" stroke="#caa24a" stroke-width="3"/>
  <line x1="172" y1="206" x2="304" y2="206" stroke="#caa24a" stroke-width="3"/>
  <line x1="172" y1="236" x2="240" y2="236" stroke="#e0a53a" stroke-width="3"/>

  <!-- PTT(측면 가장자리) -->
  <rect x="132" y="190" width="10" height="64" rx="4" fill="#707e3a" stroke="#e0a53a" stroke-width="1.5"/>

  <!-- 키패드 -->
  <g fill="#2f3422" stroke="#6a6a50" stroke-width="1.5">
    <rect x="166" y="278" width="26" height="24" rx="5"/><rect x="200" y="278" width="26" height="24" rx="5"/><rect x="234" y="278" width="26" height="24" rx="5"/><rect x="268" y="278" width="40" height="24" rx="5"/>
    <rect x="166" y="310" width="26" height="24" rx="5"/><rect x="200" y="310" width="26" height="24" rx="5"/><rect x="234" y="310" width="26" height="24" rx="5"/><rect x="268" y="310" width="40" height="24" rx="5"/>
    <rect x="166" y="342" width="26" height="24" rx="5"/><rect x="200" y="342" width="60" height="24" rx="5"/><rect x="268" y="342" width="40" height="24" rx="5"/>
  </g>
  <!-- USB-C -->
  <rect x="224" y="394" width="32" height="8" rx="4" fill="#707e3a"/>

  <!-- 콜아웃 -->
  <g stroke="#4b4636" stroke-width="1" fill="#e0a53a" font-size="12">
    <line x1="159" y1="96" x2="430" y2="96"/><text x="438" y="100" fill="#cfc8a0">LoRa 안테나 917–923.5MHz</text>
    <line x1="316" y1="96" x2="430" y2="130"/><text x="438" y="134" fill="#cfc8a0">채널 노브 (=주파수 선택)</text>
    <line x1="320" y1="200" x2="430" y2="196"/><text x="438" y="200" fill="#cfc8a0">앰버 OLED</text>
    <line x1="132" y1="222" x2="60" y2="222"/><text x="20" y="226" fill="#cfc8a0">PTT</text>
    <line x1="240" y1="398" x2="430" y2="300"/><text x="438" y="304" fill="#cfc8a0">USB-C (충전·QR 페어링)</text>
  </g>

  <text x="28" y="426" fill="#8f8a5e" font-size="11">치수(개념) 155 × 68 × 34 mm · IP67 목표 · X25519 · ChaCha20 · ATECC608</text>
</svg>
