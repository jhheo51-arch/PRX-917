[package]
name = "crypto_core"
version = "0.1.0"
edition = "2021"
description = "오프그리드 보안 메신저의 공유 암호 코어 (iOS/Android 공용)"

[lib]
# UniFFI/JNI 바인딩을 위해 정적/동적 라이브러리로 빌드 가능하게 둠
crate-type = ["lib", "staticlib", "cdylib"]

# Swift/Kotlin 바인딩 코드를 생성하는 CLI (cargo run --bin uniffi-bindgen)
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
vodozemac = "0.11.1"
uniffi = { version = "0.32.2", features = ["cli"] }
thiserror = "2.0.21"
